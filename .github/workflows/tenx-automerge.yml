name: TENX Auto Merge Controller

on:
  workflow_run:
    workflows: ['Titans Quality Gate']
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: tenx-automerge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate trusted TENX pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TENX_AUTOMERGE_MARKER: '<!-- tenx-automerge:v1 -->'
        shell: bash
        run: |
          set -euo pipefail

          conclusion="$(jq -r '.workflow_run.conclusion // ""' "$GITHUB_EVENT_PATH")"
          head_sha="$(jq -r '.workflow_run.head_sha // ""' "$GITHUB_EVENT_PATH")"
          quality_url="$(jq -r '.workflow_run.html_url // ""' "$GITHUB_EVENT_PATH")"
          mapfile -t pull_requests < <(jq -r '.workflow_run.pull_requests[]?.number' "$GITHUB_EVENT_PATH")

          if [[ ${#pull_requests[@]} -ne 1 ]]; then
            echo "TENX auto-merge skipped: expected exactly one pull request, found ${#pull_requests[@]}."
            exit 0
          fi

          pr_number="${pull_requests[0]}"
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
          state="$(jq -r '.state' <<<"$pr_json")"
          draft="$(jq -r '.draft' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          pr_head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"
          author="$(jq -r '.user.login // ""' <<<"$pr_json")"
          body="$(jq -r '.body // ""' <<<"$pr_json")"

          if [[ "$state" != "open" ]]; then
            echo "TENX auto-merge skipped: PR #${pr_number} is not open."
            exit 0
          fi
          if [[ "$draft" != "false" ]]; then
            echo "TENX auto-merge skipped: PR #${pr_number} is a draft."
            exit 0
          fi
          if [[ "$base_ref" != "main" ]]; then
            echo "TENX auto-merge skipped: PR #${pr_number} targets ${base_ref}, not main."
            exit 0
          fi
          if [[ "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
            echo "TENX auto-merge skipped: PR #${pr_number} is not a same-repository branch."
            exit 0
          fi
          if [[ "$author" != "Alecprice" ]]; then
            echo "TENX auto-merge skipped: PR #${pr_number} author ${author} is not trusted for autonomous merge."
            exit 0
          fi
          if [[ "$pr_head_sha" != "$head_sha" ]]; then
            echo "TENX auto-merge skipped: Quality Gate SHA ${head_sha} is stale; PR head is ${pr_head_sha}."
            exit 0
          fi
          if ! grep -Fq "$TENX_AUTOMERGE_MARKER" <<<"$body"; then
            echo "TENX auto-merge skipped: PR #${pr_number} does not opt in with ${TENX_AUTOMERGE_MARKER}."
            exit 0
          fi

          if [[ "$conclusion" != "success" ]]; then
            failure_marker="<!-- tenx-automerge-failure:${head_sha} -->"
            existing_comment="$(
              gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments" \
                --jq ".[] | select(.body | contains(\"${failure_marker}\")) | .id" \
                | head -n 1
            )"
            if [[ -z "$existing_comment" ]]; then
              gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments" \
                -f body="${failure_marker}
          TENX autonomous merge is **withheld** because the Titans Quality Gate concluded \`${conclusion}\` for \`${head_sha}\`.

          Quality run: ${quality_url}

          The repair loop should inspect the failing job/logs and the PR diff, make the smallest safe correction on this branch, and let the Quality Gate run again. Do not merge this revision manually while the gate is red."
            fi
            echo "TENX auto-merge withheld: Quality Gate conclusion=${conclusion}."
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
            mergeable="$(jq -r 'if .mergeable == null then "unknown" else (.mergeable|tostring) end' <<<"$pr_json")"
            mergeable_state="$(jq -r '.mergeable_state // "unknown"' <<<"$pr_json")"
            current_sha="$(jq -r '.head.sha' <<<"$pr_json")"
            current_state="$(jq -r '.state' <<<"$pr_json")"
            if [[ "$mergeable" != "unknown" ]]; then
              break
            fi
            sleep 2
          done

          if [[ "$current_state" != "open" || "$current_sha" != "$head_sha" ]]; then
            echo "TENX auto-merge skipped: PR state/head changed after the Quality Gate."
            exit 0
          fi
          if [[ "$mergeable" != "true" || "$mergeable_state" == "dirty" || "$mergeable_state" == "blocked" ]]; then
            echo "TENX auto-merge withheld: mergeable=${mergeable}, mergeable_state=${mergeable_state}."
            exit 0
          fi

          latest_blocking_reviews="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/reviews?per_page=100" \
              | jq -s '[.[][]] | sort_by(.submitted_at // "") | group_by(.user.login) | map(last) | map(select(.state == "CHANGES_REQUESTED")) | length'
          )"
          if [[ "$latest_blocking_reviews" != "0" ]]; then
            echo "TENX auto-merge withheld: ${latest_blocking_reviews} current blocking review(s)."
            exit 0
          fi

          merge_json="$(
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/merge" \
              -f merge_method='merge' \
              -f sha="$head_sha"
          )"
          merged="$(jq -r '.merged // false' <<<"$merge_json")"
          message="$(jq -r '.message // ""' <<<"$merge_json")"
          if [[ "$merged" != "true" ]]; then
            echo "TENX auto-merge failed closed: ${message}"
            exit 1
          fi

          echo "TENX auto-merged PR #${pr_number} at ${head_sha}: ${message}"

          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/cloudflare-deploy.yml/dispatches" \
            -f ref='main'
          echo "Dispatched Titans Cloudflare Deploy for the new main revision."
