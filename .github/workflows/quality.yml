name: Titans Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate browser regression scripts
        run: python -m py_compile scripts/browser-navigation-smoke.py scripts/media-browser-smoke.py scripts/command-intelligence-browser-smoke.py scripts/player-gameday-browser-smoke.py scripts/ask-titans-browser-smoke.py scripts/change-intelligence-browser-smoke.py scripts/runtime-365-browser-smoke.py scripts/smart-search-browser-smoke.py scripts/analytics-browser-smoke.py scripts/headshot-browser-smoke.py
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run Titans quality gate
        run: npm run check