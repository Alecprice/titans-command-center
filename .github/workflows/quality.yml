name: Titans Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate browser regression scripts
        run: python -m py_compile scripts/browser-navigation-smoke.py scripts/media-browser-smoke.py scripts/command-intelligence-browser-smoke.py scripts/player-gameday-browser-smoke.py scripts/ask-titans-browser-smoke.py scripts/change-intelligence-browser-smoke.py scripts/runtime-365-browser-smoke.py scripts/runtime-365-diagnostic.py scripts/smart-search-browser-smoke.py scripts/mobile-navigation-browser-smoke.py scripts/account-browser-smoke.py scripts/market-browser-smoke.py scripts/analytics-browser-smoke.py scripts/headshot-browser-smoke.py
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run Titans quality gate
        run: npm run check
