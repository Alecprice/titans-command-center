name: Titans Ticket Compare Diagnostic v157

on:
  workflow_run:
    workflows: ['Titans Cloudflare Deploy']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: titans-ticket-compare-diagnostic-v157
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Determine whether Cloudflare actually deployed this source
        id: deployed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "source_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          JOBS_JSON="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${WORKFLOW_RUN_ID}/jobs?per_page=100")"
          DEPLOY_OUTCOME="$(jq -r '[.jobs[].steps[]? | select(.name == "Deploy to Cloudflare") | .conclusion][0] // "unknown"' <<<"$JOBS_JSON")"
          echo "source_sha=${WORKFLOW_HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "Parent Cloudflare conclusion: ${WORKFLOW_CONCLUSION:-unknown}; deploy step: ${DEPLOY_OUTCOME}."
          if [[ "$DEPLOY_OUTCOME" == "success" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout deployed source
        if: steps.deployed.outputs.should_run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.deployed.outputs.source_sha }}
          persist-credentials: false

      - name: Install Selenium
        if: steps.deployed.outputs.should_run == 'true'
        run: python -m pip install --disable-pip-version-check 'selenium>=4.25,<5'

      - name: Diagnose Saved Compare production lifecycle
        if: steps.deployed.outputs.should_run == 'true'
        env:
          WORKER_URL: https://titans.alecjprice.com
          EXPECTED_SHA: ${{ steps.deployed.outputs.source_sha }}
        run: python scripts/ticket-compare-diagnostic-v157.py

      - name: Record stale or skipped deploy
        if: steps.deployed.outputs.should_run != 'true'
        run: echo 'Ticket Compare diagnostic skipped because the triggering Cloudflare workflow did not deploy its source SHA.'
