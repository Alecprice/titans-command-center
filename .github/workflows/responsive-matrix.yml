name: Titans Responsive Matrix

on:
  workflow_run:
    workflows: ['Titans Cloudflare Deploy']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: titans-responsive-production
  cancel-in-progress: true

jobs:
  responsive:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout production branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check 'selenium>=4.25,<5'
      - name: Run multi-viewport production regression
        env:
          WORKER_URL: https://titans-command-center.alecjordanprice.workers.dev
        run: python scripts/responsive-matrix-smoke.py
