name: Titans Ticket Full Smoke Diagnostic v158

on:
  workflow_run:
    workflows: ['Titans Cloudflare Deploy']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: titans-ticket-full-smoke-diagnostic-v158
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Determine whether Cloudflare actually deployed this source
        id: deployed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "source_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          JOBS_JSON="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${WORKFLOW_RUN_ID}/jobs?per_page=100")"
          DEPLOY_OUTCOME="$(jq -r '[.jobs[].steps[]? | select(.name == "Deploy to Cloudflare") | .conclusion][0] // "unknown"' <<<"$JOBS_JSON")"
          echo "source_sha=${WORKFLOW_HEAD_SHA}" >> "$GITHUB_OUTPUT"
          if [[ "$DEPLOY_OUTCOME" == "success" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout deployed source
        if: steps.deployed.outputs.should_run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.deployed.outputs.source_sha }}
          persist-credentials: false

      - name: Confirm production still serves this exact revision
        id: current
        if: steps.deployed.outputs.should_run == 'true'
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.deployed.outputs.source_sha }}
        run: |
          set -euo pipefail
          DEPLOYED_SHA="$(curl --fail --silent --show-error --retry 2 \
            -H 'Accept: application/json' -H 'Cache-Control: no-cache' \
            https://titans.alecjprice.com/build-meta.json | jq -r '.commit // empty')"
          if [[ "$DEPLOYED_SHA" == "$EXPECTED_SHA" ]]; then
            echo "should_trace=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_trace=false" >> "$GITHUB_OUTPUT"
            echo "Production moved before v158 trace: expected ${EXPECTED_SHA}, found ${DEPLOYED_SHA:-unknown}."
          fi

      - name: Install Selenium
        if: steps.current.outputs.should_trace == 'true'
        run: python -m pip install --disable-pip-version-check 'selenium>=4.25,<5'

      - name: Trace unchanged Ticket Center full smoke
        if: steps.current.outputs.should_trace == 'true'
        env:
          WORKER_URL: https://titans.alecjprice.com
        run: python scripts/tickets-browser-smoke-trace-v158.py

      - name: Record skipped diagnostic
        if: steps.deployed.outputs.should_run != 'true' || steps.current.outputs.should_trace == 'false'
        run: echo 'Ticket full-smoke trace skipped because the triggering source was not the current production revision.'
