name: nflreadpy Analytics D1 Snapshots

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ingest_nflreadpy.py'
      - 'scripts/nflreadpy_d1_entrypoint.py'
      - 'requirements-analytics.txt'
      - 'src/d1-api-snapshot.mjs'
      - '.github/workflows/nflreadpy-ingest.yml'
  schedule:
    - cron: '25 11 * * *'
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Comma-separated NFL seasons to publish (example: 2025,2026)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: titans-nflreadpy-analytics
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE: titans-command-center
      NFLREADPY_SQL_OUT: /tmp/nflreadpy-d1.sql
      NFLREADPY_SUMMARY_OUT: /tmp/nflreadpy-d1-summary.json
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-analytics.txt

      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install analytics dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-analytics.txt

      - name: Resolve seasons
        shell: bash
        env:
          MANUAL_SEASONS: ${{ github.event.inputs.seasons }}
        run: |
          if [[ -n "$MANUAL_SEASONS" ]]; then
            seasons="$MANUAL_SEASONS"
          elif [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            seasons="2026"
          else
            seasons="2025,2026"
          fi
          echo "NFLREADPY_SEASONS=$seasons" >> "$GITHUB_ENV"
          echo "Analytics seasons: $seasons"

      - name: Require D1 deployment credentials
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo 'Cloudflare GitHub Actions credentials are required to publish analytics snapshots.' >&2
            exit 1
          fi

      - name: Build nflverse analytics snapshots
        run: python scripts/nflreadpy_d1_entrypoint.py

      - name: Validate generated snapshot bundle
        id: summary
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          summary = json.loads(Path(os.environ['NFLREADPY_SUMMARY_OUT']).read_text())
          sql_path = Path(os.environ['NFLREADPY_SQL_OUT'])
          snapshots = int(summary.get('snapshots') or 0)
          available = int(summary.get('availableSnapshots') or 0)
          if not summary.get('ok') or available < 1:
              raise SystemExit('nflreadpy did not build an available analytics snapshot')
          if summary.get('teams') != 32:
              raise SystemExit(f"Expected 32 NFL teams, got {summary.get('teams')}")
          if snapshots < 1 or available != snapshots:
              raise SystemExit(f'Expected every generated analytics snapshot to be available; available={available}, snapshots={snapshots}')
          if not sql_path.exists() or sql_path.stat().st_size < 1000:
              raise SystemExit('Generated D1 snapshot SQL is missing or unexpectedly small')

          # Wrangler D1 remote file execution supplies its own atomic execution boundary and
          # rejects explicit BEGIN/COMMIT/SAVEPOINT statements. Strip only the builder's exact
          # legacy wrapper lines; the snapshot writes themselves are idempotent UPSERTs.
          original_sql = sql_path.read_text(encoding='utf-8')
          wrapper_statements = {'BEGIN TRANSACTION;', 'COMMIT;'}
          cleaned_lines = [line for line in original_sql.splitlines() if line.strip().upper() not in wrapper_statements]
          cleaned_sql = '\n'.join(cleaned_lines).rstrip() + '\n'
          if re.search(r'^\s*(?:BEGIN(?:\s+TRANSACTION)?|SAVEPOINT|RELEASE\s+SAVEPOINT|COMMIT|ROLLBACK)\b', cleaned_sql, re.I | re.M):
              raise SystemExit('Generated D1 snapshot SQL contains an unsupported manual transaction statement')
          if 'INSERT INTO api_snapshots' not in cleaned_sql or 'ON CONFLICT(cache_key) DO UPDATE' not in cleaned_sql:
              raise SystemExit('Generated D1 snapshot SQL is missing its idempotent upsert contract')
          sql_path.write_text(cleaned_sql, encoding='utf-8')

          ten_keys = summary.get('tennesseeKeys') or []
          if not ten_keys:
              raise SystemExit('No Tennessee analytics snapshot key was generated')
          target = ten_keys[-1]
          if not re.fullmatch(r'advanced-analytics:v1:season=\d{4}:team=TEN', target):
              raise SystemExit(f'Unexpected Tennessee snapshot key: {target!r}')
          print(json.dumps({
              'snapshots': snapshots,
              'availableSnapshots': available,
              'unavailableSnapshots': snapshots - available,
              'targetKey': target,
              'expiresAt': summary.get('expiresAt'),
              'coverage': summary.get('coverage'),
              'd1SqlBytes': sql_path.stat().st_size,
          }, indent=2))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"ten_key={target}\n")
          PY

      - name: Publish analytics snapshots to D1
        run: npx --yes wrangler@4 d1 execute "$D1_DATABASE" --remote --file "$NFLREADPY_SQL_OUT"

      - name: Verify Tennessee analytics snapshot in D1
        shell: bash
        env:
          TEN_KEY: ${{ steps.summary.outputs.ten_key }}
        run: |
          npx --yes wrangler@4 d1 execute "$D1_DATABASE" --remote --json --command \
            "SELECT cache_key,source,json_extract(payload,'$.status') AS status,json_extract(payload,'$.dataSeason') AS data_season,json_extract(payload,'$.summary.offensiveEpaPerPlay') AS offensive_epa,json_array_length(payload,'$.recentPlays') AS recent_plays,json_array_length(payload,'$.byDown') AS down_splits,json_array_length(payload,'$.personnel') AS personnel_splits FROM api_snapshots WHERE cache_key='$TEN_KEY' LIMIT 1;" \
            > /tmp/nflreadpy-d1-verify.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/nflreadpy-d1-verify.json').read_text())
          blocks = data if isinstance(data, list) else [data]
          rows = []
          for block in blocks:
              if not isinstance(block, dict):
                  continue
              result = block.get('results')
              if isinstance(result, list):
                  rows.extend(result)
              nested = block.get('result')
              if isinstance(nested, list):
                  rows.extend(nested)
              elif isinstance(nested, dict) and isinstance(nested.get('results'), list):
                  rows.extend(nested['results'])
          if len(rows) != 1:
              raise SystemExit(f'Expected exactly one D1 verification row, got {len(rows)}')
          row = rows[0]
          print(json.dumps(row, indent=2))
          if row.get('source') != 'nflreadpy-d1-snapshot':
              raise SystemExit('D1 analytics snapshot source is incorrect')
          if row.get('status') != 'available':
              raise SystemExit(f"D1 analytics snapshot is not available: {row.get('status')}")
          if row.get('data_season') is None or row.get('offensive_epa') is None:
              raise SystemExit('D1 analytics snapshot is missing its data season or EPA summary')
          if int(row.get('recent_plays') or 0) < 1 or int(row.get('down_splits') or 0) < 1:
              raise SystemExit('D1 analytics snapshot is missing situation detail')
          PY
