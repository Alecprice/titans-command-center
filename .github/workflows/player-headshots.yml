name: Titans Player Headshots

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_player_headshots.py'
      - 'requirements-analytics.txt'
      - '.github/workflows/player-headshots.yml'
  schedule:
    - cron: '50 11 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: titans-player-headshots
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-analytics.txt

      - name: Install nflreadpy
        run: python -m pip install --disable-pip-version-check -r requirements-analytics.txt

      - name: Build Titans headshot manifest
        run: python scripts/build_player_headshots.py

      - name: Validate manifest
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('assets/data/player-headshots.json').read_text())
          rows=data.get('players') or []
          omitted=data.get('omittedPlayers') or []
          reasons=data.get('omissionReasons') or {}
          roster_rows=int(data.get('rosterRows') or 0)
          headshots=int(data.get('headshotCount') or 0)
          omitted_count=int(data.get('omittedCount') or 0)
          assert data.get('team')=='TEN'
          assert len(rows)>=60, f'headshot coverage too low: {len(rows)}'
          assert len(rows)==headshots
          assert len(omitted)==omitted_count
          assert headshots+omitted_count==roster_rows, (headshots, omitted_count, roster_rows)
          assert sum(int(value) for value in reasons.values())==omitted_count
          assert 0<=float(data.get('coveragePct',-1))<=100
          assert all(row.get('reason') in {'no-approved-headshot-url','missing-player-name'} for row in omitted)
          assert all(str(row.get('headshotUrl','')).startswith('https://') for row in rows)
          print({'season':data.get('season'),'headshots':headshots,'rosterRows':roster_rows,'coveragePct':data.get('coveragePct'),'omittedCount':omitted_count,'omissionReasons':reasons})
          PY

      - name: Commit refreshed manifest
        id: commit_manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/player-headshots.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'chore: refresh Titans player headshots'
          git push
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Dispatch production release for refreshed manifest
        if: steps.commit_manifest.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            -X POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/cloudflare-deploy.yml/dispatches" \
            -f ref='main' >/dev/null
          echo 'Dispatched Titans Cloudflare Deploy for the refreshed headshot manifest on main.'
