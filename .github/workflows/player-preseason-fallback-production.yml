name: Player Preseason Fallback Production Gate

on:
  workflow_run:
    workflows: ['Titans Cloudflare Deploy']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: player-preseason-fallback-production
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKER_URL: https://titans-command-center.alecjordanprice.workers.dev
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.2.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify exact production revision
        shell: bash
        run: |
          node - <<'NODE'
          const base=String(process.env.WORKER_URL||'').replace(/\/$/,'');
          const expected=String(process.env.EXPECTED_SHA||'').trim();
          const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          let lastCommit=null,lastStatus=null,lastError=null;
          (async()=>{
            for(let attempt=1;attempt<=10;attempt++){
              try{
                const response=await fetch(`${base}/build-meta.json?expected=${encodeURIComponent(expected)}&attempt=${attempt}&ts=${Date.now()}`,{
                  cache:'no-store',
                  headers:{
                    'User-Agent':'TitansCommandCenter-ProductionAudit/1.0',
                    'Cache-Control':'no-cache, no-store',
                    'Pragma':'no-cache'
                  },
                  signal:AbortSignal.timeout(15000)
                });
                lastStatus=response.status;
                if(response.ok){
                  const meta=await response.json();
                  lastCommit=meta?.commit||null;
                  if(lastCommit===expected){
                    console.log(JSON.stringify({ok:true,expected,buildMeta:meta,attempt,status:response.status},null,2));
                    return;
                  }
                }else{
                  lastError=`HTTP ${response.status}`;
                }
              }catch(error){
                lastError=error instanceof Error?error.message:String(error);
              }
              if(attempt<10)await wait(2000);
            }
            throw new Error(`Production revision mismatch: expected ${expected}, got ${lastCommit||'unknown'} (status ${lastStatus||'unknown'}${lastError?`, ${lastError}`:''})`);
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE

      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check 'selenium>=4.25,<5'

      - name: Run Player Intelligence preseason fallback regression
        run: python scripts/player-preseason-fallback-browser-smoke.py
