name: Player Preseason Fallback Production Gate

on:
  workflow_run:
    workflows: ['Titans Cloudflare Deploy']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: player-preseason-fallback-production
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKER_URL: https://titans-command-center.alecjordanprice.workers.dev
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify exact production revision
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base=os.environ['WORKER_URL'].rstrip('/')
          expected=os.environ['EXPECTED_SHA']
          last=None
          for attempt in range(1,7):
              with urllib.request.urlopen(f'{base}/build-meta.json?verify={attempt}',timeout=10) as response:
                  last=json.load(response)
              if last.get('commit')==expected:
                  print(json.dumps({'ok':True,'expected':expected,'buildMeta':last,'attempt':attempt},indent=2))
                  break
              time.sleep(2)
          else:
              raise SystemExit(f'Production revision mismatch: expected {expected}, got {last}')
          PY

      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check 'selenium>=4.25,<5'

      - name: Run Player Intelligence preseason fallback regression
        run: python scripts/player-preseason-fallback-browser-smoke.py
