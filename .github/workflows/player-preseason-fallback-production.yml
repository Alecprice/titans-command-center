name: Player Preseason Fallback Production Gate

on:
  workflow_run:
    workflows: ['Titans Cloudflare Deploy']
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: player-preseason-fallback-production
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKER_URL: https://titans.alecjprice.com
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Determine whether Cloudflare actually deployed this source
        id: deployed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          JOBS_JSON="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${WORKFLOW_RUN_ID}/jobs?per_page=100")"
          DEPLOY_OUTCOME="$(jq -r '[.jobs[].steps[]? | select(.name == "Deploy to Cloudflare") | .conclusion][0] // "unknown"' <<<"$JOBS_JSON")"
          echo "cloudflare_deploy_outcome=${DEPLOY_OUTCOME}" >> "$GITHUB_OUTPUT"
          echo "Parent Cloudflare workflow conclusion: ${WORKFLOW_CONCLUSION:-unknown}; deploy step conclusion: ${DEPLOY_OUTCOME}."
          if [[ "$DEPLOY_OUTCOME" == "success" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployed ${WORKFLOW_HEAD_SHA}; validating the Player Intelligence preseason fallback production contract."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare step outcome was ${DEPLOY_OUTCOME}; this source was not deployed, so the Player Intelligence preseason fallback assertion is skipped."
          fi

      - name: Checkout deployed revision
        if: steps.deployed.outputs.should_run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Use Node 24
        if: steps.deployed.outputs.should_run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.2.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify exact production revision
        if: steps.deployed.outputs.should_run == 'true'
        shell: bash
        run: |
          node - <<'NODE'
          const base=String(process.env.WORKER_URL||'').replace(/\/$/,'');
          const expected=String(process.env.EXPECTED_SHA||'').trim();
          const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          let lastCommit=null,lastStatus=null,lastError=null;
          (async()=>{
            for(let attempt=1;attempt<=10;attempt++){
              try{
                const response=await fetch(`${base}/build-meta.json?expected=${encodeURIComponent(expected)}&attempt=${attempt}&ts=${Date.now()}`,{
                  cache:'no-store',
                  headers:{
                    'User-Agent':'TitansCommandCenter-ProductionAudit/1.0',
                    'Cache-Control':'no-cache, no-store',
                    'Pragma':'no-cache'
                  },
                  signal:AbortSignal.timeout(15000)
                });
                lastStatus=response.status;
                if(response.ok){
                  const meta=await response.json();
                  lastCommit=meta?.commit||null;
                  if(lastCommit===expected){
                    console.log(JSON.stringify({ok:true,expected,buildMeta:meta,attempt,status:response.status},null,2));
                    return;
                  }
                }else{
                  lastError=`HTTP ${response.status}`;
                }
              }catch(error){
                lastError=error instanceof Error?error.message:String(error);
              }
              if(attempt<10)await wait(2000);
            }
            throw new Error(`Production revision mismatch: expected ${expected}, got ${lastCommit||'unknown'} (status ${lastStatus||'unknown'}${lastError?`, ${lastError}`:''})`);
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE

      - name: Install Selenium
        if: steps.deployed.outputs.should_run == 'true'
        run: python -m pip install --disable-pip-version-check 'selenium>=4.25,<5'

      - name: Run Player Intelligence preseason fallback regression
        if: steps.deployed.outputs.should_run == 'true'
        run: python scripts/player-preseason-fallback-browser-smoke.py

      - name: Record stale or skipped deploy
        if: steps.deployed.outputs.should_run != 'true'
        run: echo 'Player Intelligence preseason fallback production check skipped because the triggering Cloudflare workflow did not deploy its source SHA.'
