name: Team Room Semantic Writer Diagnostic

on:
  push:
    branches:
      - agent/team-room-semantic-writer-v58-20260828
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium

      - name: Trace Team Room semantic writer
        env:
          TCC_BASE_URL: https://titans-command-center.alecjordanprice.workers.dev
        run: python scripts/team-room-semantic-writer-diagnostic.py
