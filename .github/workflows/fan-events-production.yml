name: Fan Events Production Gate

on:
  workflow_run:
    workflows: ["Titans Cloudflare Deploy"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fan-events-production-gate
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_URL: https://titans.alecjprice.com
    steps:
      - name: Determine whether Cloudflare actually deployed this source
        id: deployed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "source_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "Manual Fan Events production verification requested for ${GITHUB_SHA}."
            exit 0
          fi

          JOBS_JSON="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${WORKFLOW_RUN_ID}/jobs?per_page=100")"
          DEPLOY_OUTCOME="$(jq -r '[.jobs[].steps[]? | select(.name == "Deploy to Cloudflare") | .conclusion][0] // "unknown"' <<<"$JOBS_JSON")"
          echo "cloudflare_deploy_outcome=${DEPLOY_OUTCOME}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${WORKFLOW_HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "Parent Cloudflare workflow conclusion: ${WORKFLOW_CONCLUSION:-unknown}; deploy step conclusion: ${DEPLOY_OUTCOME}."
          if [[ "$DEPLOY_OUTCOME" == "success" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployed ${WORKFLOW_HEAD_SHA}; validating the Fan Events production contract even if a later unrelated regression failed."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare step outcome was ${DEPLOY_OUTCOME}; this source was not deployed, so the Fan Events production assertion is skipped."
          fi

      - name: Checkout deployed source
        if: steps.deployed.outputs.should_run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.deployed.outputs.source_sha }}
          persist-credentials: false

      - name: Use Node 24
        if: steps.deployed.outputs.should_run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify Fan Event Radar production contract
        if: steps.deployed.outputs.should_run == 'true'
        run: node scripts/fan-events-production-regression.mjs

      - name: Record stale or skipped deploy
        if: steps.deployed.outputs.should_run != 'true'
        run: echo 'Fan Events production check skipped because the triggering Cloudflare workflow did not deploy its source SHA.'
