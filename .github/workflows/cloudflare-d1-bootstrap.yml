name: Titans D1 Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: titans-d1-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: titans-command-center
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Ensure D1 database exists
        shell: bash
        run: |
          node - <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const name=process.env.D1_DATABASE_NAME;
          const base=`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database`;
          const headers={Authorization:`Bearer ${token}`,'Content-Type':'application/json'};
          const request=async(url,options={})=>{
            const response=await fetch(url,{...options,headers:{...headers,...options.headers}});
            const body=await response.json().catch(()=>({}));
            if(!response.ok||body.success===false){
              const messages=[...(body.errors||[]),...(body.messages||[])].map(x=>x.message).filter(Boolean);
              throw new Error(`Cloudflare D1 API ${response.status}: ${messages.join('; ')||'request failed'}`);
            }
            return body;
          };
          const list=await request(base);
          let db=(list.result||[]).find(row=>row.name===name);
          if(!db){
            const created=await request(base,{method:'POST',body:JSON.stringify({name,primary_location_hint:'enam',read_replication:{mode:'auto'}})});
            db=created.result;
            console.log(`Created D1 database ${name}.`);
          }else{
            console.log(`D1 database ${name} already exists.`);
          }
          if(!db?.uuid)throw new Error('Cloudflare did not return a D1 database UUID.');
          NODE

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Bind D1 and apply migrations
        run: npm run d1:configure

      - name: Run quality gate
        run: npm run check

      - name: Commit D1 binding
        shell: bash
        run: |
          if git diff --quiet -- wrangler.jsonc; then
            echo 'wrangler.jsonc already contains the D1 binding.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wrangler.jsonc
          git commit -m 'chore: bind Titans Cloudflare D1 database [skip ci]'
          git push
