name: TENX Coordination Guard

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to audit
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

jobs:
  coordinate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check active TENX work claims
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TENX_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          TENX_STALE_HOURS: '24'
        run: node scripts/tenx-coordination.mjs
