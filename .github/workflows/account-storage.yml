name: Titans Account Storage

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ensure-account-preferences.mjs'
      - 'db/migrations/20260822_fan_user_preferences.sql'
      - '.github/workflows/account-storage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: titans-account-storage-production
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Require database secret
        shell: bash
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo 'DATABASE_URL secret is required for account preference storage.' >&2
            exit 1
          fi

      - name: Provision account preference storage
        run: node scripts/ensure-account-preferences.mjs
