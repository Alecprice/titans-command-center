name: Titans Current Experience Audit

on:
  workflow_run:
    workflows: ['Titans Cloudflare Deploy']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: titans-current-experience-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WORKER_URL: https://titans-command-center.alecjordanprice.workers.dev
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout deployed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Confirm deployed SHA
        shell: bash
        run: |
          python - <<'PY'
          import json,time,urllib.request,os,sys
          base=os.environ['WORKER_URL'].rstrip('/')
          expected=os.environ['EXPECTED_SHA']
          last=None
          for attempt in range(1,16):
              try:
                  with urllib.request.urlopen(f'{base}/build-meta.json?audit={attempt}',timeout=10) as response:
                      data=json.load(response);last=data.get('commit')
                      if last==expected:
                          print(json.dumps({'ok':True,'commit':last,'attempt':attempt}));sys.exit(0)
              except Exception as exc:
                  last=f'{type(exc).__name__}: {exc}'
              time.sleep(2)
          raise SystemExit(f'Expected deployed SHA {expected}; last observed {last}')
          PY

      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check 'selenium>=4.25,<5'

      - name: Diagnose Runtime and 365 mobile flow
        run: python scripts/runtime-365-diagnostic.py

      - name: Audit Smart Search
        run: python scripts/smart-search-browser-smoke.py

      - name: Audit mobile navigation
        run: python scripts/mobile-navigation-browser-smoke.py

      - name: Audit Account and Guest flow
        run: python scripts/account-browser-smoke.py

      - name: Audit live markets
        run: python scripts/market-browser-smoke.py

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-experience-${{ github.event.workflow_run.head_sha }}
          path: |
            /tmp/runtime-365-diagnostic.json
            /tmp/smart-search-browser-smoke.json
            /tmp/mobile-navigation-browser-smoke.json
            /tmp/account-browser-smoke.json
            /tmp/market-browser-smoke.json
          if-no-files-found: ignore
          retention-days: 14
