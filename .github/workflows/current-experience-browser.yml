name: Titans Current Experience Audit

on:
  workflow_run:
    workflows: ['Titans Cloudflare Deploy']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  statuses: write

concurrency:
  group: titans-current-experience-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WORKER_URL: https://titans.alecjprice.com
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout deployed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Confirm deployed SHA
        id: deployed_sha
        continue-on-error: true
        shell: bash
        run: |
          node - <<'NODE'
          const base = process.env.WORKER_URL.replace(/\/$/, '');
          const expected = process.env.EXPECTED_SHA;
          let last = null;
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          for (let attempt = 1; attempt <= 15; attempt++) {
            try {
              const response = await fetch(`${base}/build-meta.json?audit=${attempt}`, {
                cache: 'no-store',
                headers: {
                  accept: 'application/json',
                  'user-agent': 'Titans-Current-Experience-Audit/1.0',
                },
              });
              const text = await response.text();
              if (!response.ok) {
                last = `HTTP ${response.status}: ${text.slice(0, 160)}`;
              } else {
                const data = JSON.parse(text);
                last = data?.commit || null;
                if (last === expected) {
                  console.log(JSON.stringify({ok: true, commit: last, attempt}));
                  process.exit(0);
                }
              }
            } catch (error) {
              last = `${error?.name || 'Error'}: ${error?.message || String(error)}`;
            }
            await sleep(2000);
          }
          console.error(`Expected deployed SHA ${expected}; last observed ${last}`);
          process.exit(1);
          NODE

      - name: Record non-deployed revision skip
        if: steps.deployed_sha.outcome != 'success'
        shell: bash
        run: |
          {
            echo '## Titans Current Experience Audit'
            echo
            echo 'Browser audit skipped because this workflow source revision is not the revision currently served by production.'
            echo 'This is not a Current Experience regression; deployment status remains owned by the Cloudflare deploy workflow.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Selenium
        if: steps.deployed_sha.outcome == 'success'
        run: python -m pip install --disable-pip-version-check 'selenium>=4.25,<5'

      - name: Diagnose Runtime and 365 mobile flow
        id: runtime_365
        if: steps.deployed_sha.outcome == 'success'
        continue-on-error: true
        run: python scripts/runtime-365-diagnostic.py

      - name: Audit Smart Search
        id: smart_search
        if: steps.deployed_sha.outcome == 'success'
        continue-on-error: true
        run: python scripts/smart-search-browser-smoke.py

      - name: Audit mobile navigation
        id: mobile_nav
        if: steps.deployed_sha.outcome == 'success'
        continue-on-error: true
        run: python scripts/mobile-navigation-browser-smoke.py

      - name: Audit Fantasy Command
        id: fantasy_command
        if: steps.deployed_sha.outcome == 'success'
        continue-on-error: true
        run: python scripts/fantasy-browser-smoke.py

      - name: Audit Fantasy Decision Center
        id: fantasy_decision
        if: steps.deployed_sha.outcome == 'success'
        continue-on-error: true
        run: python scripts/fantasy-decision-browser-smoke.py

      - name: Audit Account and Guest flow
        id: account_guest
        if: steps.deployed_sha.outcome == 'success'
        continue-on-error: true
        run: python scripts/account-browser-smoke.py

      - name: Audit live markets
        id: live_markets
        if: steps.deployed_sha.outcome == 'success'
        continue-on-error: true
        run: python scripts/market-browser-smoke.py

      - name: Audit Legacy museum
        id: legacy_museum
        if: steps.deployed_sha.outcome == 'success'
        continue-on-error: true
        run: python scripts/legacy-browser-smoke.py

      - name: Upload audit reports
        if: steps.deployed_sha.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: current-experience-${{ github.event.workflow_run.head_sha }}
          path: |
            /tmp/runtime-365-diagnostic.json
            /tmp/smart-search-browser-smoke.json
            /tmp/mobile-navigation-browser-smoke.json
            /tmp/fantasy-browser-smoke.json
            /tmp/fantasy-decision-browser-smoke.json
            /tmp/account-browser-smoke.json
            /tmp/market-browser-smoke.json
            /tmp/legacy-browser-smoke.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Current Experience commit status
        if: steps.deployed_sha.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RUNTIME_OUTCOME: ${{ steps.runtime_365.outcome }}
          SEARCH_OUTCOME: ${{ steps.smart_search.outcome }}
          MOBILE_OUTCOME: ${{ steps.mobile_nav.outcome }}
          FANTASY_OUTCOME: ${{ steps.fantasy_command.outcome }}
          FANTASY_DECISION_OUTCOME: ${{ steps.fantasy_decision.outcome }}
          ACCOUNT_OUTCOME: ${{ steps.account_guest.outcome }}
          MARKET_OUTCOME: ${{ steps.live_markets.outcome }}
          LEGACY_OUTCOME: ${{ steps.legacy_museum.outcome }}
        with:
          script: |
            const checks = {
              runtime: process.env.RUNTIME_OUTCOME,
              search: process.env.SEARCH_OUTCOME,
              mobile: process.env.MOBILE_OUTCOME,
              fantasy: process.env.FANTASY_OUTCOME,
              decisions: process.env.FANTASY_DECISION_OUTCOME,
              account: process.env.ACCOUNT_OUTCOME,
              markets: process.env.MARKET_OUTCOME,
              legacy: process.env.LEGACY_OUTCOME,
            };
            const failed = Object.entries(checks).filter(([, value]) => value !== 'success');
            const state = failed.length ? 'failure' : 'success';
            const description = failed.length
              ? `Failed: ${failed.map(([name]) => name).join(', ')}`.slice(0, 140)
              : 'Runtime, search, mobile, fantasy, decisions, account, markets and Legacy passed';
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: context.payload.workflow_run.head_sha,
              state,
              context: 'Titans Current Experience',
              description,
              target_url: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${context.runId}`,
            });

      - name: Fail audit when any evaluated current-experience check failed
        if: steps.deployed_sha.outcome == 'success'
        env:
          RUNTIME_OUTCOME: ${{ steps.runtime_365.outcome }}
          SEARCH_OUTCOME: ${{ steps.smart_search.outcome }}
          MOBILE_OUTCOME: ${{ steps.mobile_nav.outcome }}
          FANTASY_OUTCOME: ${{ steps.fantasy_command.outcome }}
          FANTASY_DECISION_OUTCOME: ${{ steps.fantasy_decision.outcome }}
          ACCOUNT_OUTCOME: ${{ steps.account_guest.outcome }}
          MARKET_OUTCOME: ${{ steps.live_markets.outcome }}
          LEGACY_OUTCOME: ${{ steps.legacy_museum.outcome }}
        run: |
          for outcome in "$RUNTIME_OUTCOME" "$SEARCH_OUTCOME" "$MOBILE_OUTCOME" "$FANTASY_OUTCOME" "$FANTASY_DECISION_OUTCOME" "$ACCOUNT_OUTCOME" "$MARKET_OUTCOME" "$LEGACY_OUTCOME"; do
            [[ "$outcome" == "success" ]] || exit 1
          done
