name: Titans Post-Deploy Browser Diagnostics

on:
  workflow_run:
    workflows: ['Titans Cloudflare Deploy']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: titans-postdeploy-browser-diagnostics
  cancel-in-progress: true

jobs:
  diagnostics:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WORKER_URL: https://titans-command-center.alecjordanprice.workers.dev
      SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify source revision is live
        id: deployment
        shell: bash
        run: |
          node --input-type=module <<'NODE' > /tmp/deployed-revision.txt
          const base=process.env.WORKER_URL.replace(/\/$/,'');
          const expected=(process.env.SOURCE_SHA||'').trim();
          try {
            const response=await fetch(`${base}/build-meta.json?diagnostic=${Date.now()}`,{cache:'no-store'});
            if(!response.ok) throw new Error(`HTTP ${response.status}`);
            const meta=await response.json();
            const live=String(meta?.commit||'').trim();
            const matches=!expected || live===expected;
            console.log(`expected=${expected||'manual-dispatch'}`);
            console.log(`live=${live||'unknown'}`);
            console.log(`deployed=${matches?'true':'false'}`);
          } catch(error) {
            console.log(`expected=${expected||'manual-dispatch'}`);
            console.log('live=unavailable');
            console.log('deployed=false');
            console.log(`error=${error?.message||error}`);
          }
          NODE
          cat /tmp/deployed-revision.txt
          grep '^deployed=' /tmp/deployed-revision.txt >> "$GITHUB_OUTPUT"
          grep '^live=' /tmp/deployed-revision.txt >> "$GITHUB_OUTPUT"

      - name: Install Selenium
        if: steps.deployment.outputs.deployed == 'true'
        run: python -m pip install --disable-pip-version-check 'selenium>=4.25,<5'

      - name: Navigation and Team Room
        id: navigation
        if: steps.deployment.outputs.deployed == 'true'
        continue-on-error: true
        run: python scripts/browser-navigation-smoke.py

      - name: Listen Watch
        id: media
        if: steps.deployment.outputs.deployed == 'true'
        continue-on-error: true
        run: python scripts/media-browser-smoke.py

      - name: Market Pulse
        id: market
        if: steps.deployment.outputs.deployed == 'true'
        continue-on-error: true
        run: python scripts/market-browser-smoke.py

      - name: Command Intelligence
        id: command
        if: steps.deployment.outputs.deployed == 'true'
        continue-on-error: true
        run: python scripts/command-intelligence-browser-smoke.py

      - name: Player Intelligence and Game Day
        id: player_gameday
        if: steps.deployment.outputs.deployed == 'true'
        continue-on-error: true
        run: python scripts/player-gameday-browser-smoke.py

      - name: Ask Titans
        id: ask
        if: steps.deployment.outputs.deployed == 'true'
        continue-on-error: true
        run: python scripts/ask-titans-browser-smoke.py

      - name: Change Intelligence
        id: change
        if: steps.deployment.outputs.deployed == 'true'
        continue-on-error: true
        run: python scripts/change-intelligence-browser-smoke.py

      - name: Runtime and 365 Mode
        id: runtime_365
        if: steps.deployment.outputs.deployed == 'true'
        continue-on-error: true
        run: python scripts/runtime-365-browser-smoke.py

      - name: Data freshness
        id: freshness
        if: steps.deployment.outputs.deployed == 'true'
        continue-on-error: true
        run: python scripts/freshness-browser-smoke.py

      - name: Account and Guest
        id: account
        if: steps.deployment.outputs.deployed == 'true'
        continue-on-error: true
        run: python scripts/account-browser-smoke.py

      - name: Advanced analytics
        id: analytics
        if: steps.deployment.outputs.deployed == 'true'
        continue-on-error: true
        run: python scripts/analytics-browser-smoke.py

      - name: Player headshots
        id: headshots
        if: steps.deployment.outputs.deployed == 'true'
        continue-on-error: true
        run: python scripts/headshot-browser-smoke.py

      - name: Expanded responsive matrix
        id: responsive
        if: steps.deployment.outputs.deployed == 'true'
        continue-on-error: true
        run: python scripts/responsive-matrix-smoke.py

      - name: Rendered readability and contrast audit
        id: readability
        if: steps.deployment.outputs.deployed == 'true'
        continue-on-error: true
        run: python scripts/readability-browser-smoke.py

      - name: Publish diagnostic summary
        if: always()
        shell: bash
        env:
          DEPLOYED: ${{ steps.deployment.outputs.deployed }}
          LIVE_SHA: ${{ steps.deployment.outputs.live }}
          NAVIGATION: ${{ steps.navigation.outcome }}
          MEDIA: ${{ steps.media.outcome }}
          MARKET: ${{ steps.market.outcome }}
          COMMAND: ${{ steps.command.outcome }}
          PLAYER_GAMEDAY: ${{ steps.player_gameday.outcome }}
          ASK: ${{ steps.ask.outcome }}
          CHANGE: ${{ steps.change.outcome }}
          RUNTIME_365: ${{ steps.runtime_365.outcome }}
          FRESHNESS: ${{ steps.freshness.outcome }}
          ACCOUNT: ${{ steps.account.outcome }}
          ANALYTICS: ${{ steps.analytics.outcome }}
          HEADSHOTS: ${{ steps.headshots.outcome }}
          RESPONSIVE: ${{ steps.responsive.outcome }}
          READABILITY: ${{ steps.readability.outcome }}
        run: |
          {
            echo '## Titans post-deploy browser diagnostics'
            echo
            echo "- Source SHA: ${SOURCE_SHA:-manual-dispatch}"
            echo "- Live SHA: ${LIVE_SHA:-unknown}"
            echo "- Source revision verified live: ${DEPLOYED:-false}"
            echo
            echo '| Surface | Result |'
            echo '| --- | --- |'
            echo "| Navigation / Team Room | ${NAVIGATION:-not-run} |"
            echo "| Listen Watch | ${MEDIA:-not-run} |"
            echo "| Market Pulse | ${MARKET:-not-run} |"
            echo "| Command Intelligence | ${COMMAND:-not-run} |"
            echo "| Player Intelligence / Game Day | ${PLAYER_GAMEDAY:-not-run} |"
            echo "| Ask Titans | ${ASK:-not-run} |"
            echo "| Change Intelligence | ${CHANGE:-not-run} |"
            echo "| Runtime / 365 Mode | ${RUNTIME_365:-not-run} |"
            echo "| Data freshness | ${FRESHNESS:-not-run} |"
            echo "| Account / Guest | ${ACCOUNT:-not-run} |"
            echo "| Advanced analytics | ${ANALYTICS:-not-run} |"
            echo "| Player headshots | ${HEADSHOTS:-not-run} |"
            echo "| Expanded responsive matrix | ${RESPONSIVE:-not-run} |"
            echo "| Rendered readability / contrast | ${READABILITY:-not-run} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any browser diagnostic failed
        if: always()
        shell: bash
        env:
          DEPLOYED: ${{ steps.deployment.outputs.deployed }}
          OUTCOMES: >-
            ${{ steps.navigation.outcome }} ${{ steps.media.outcome }} ${{ steps.market.outcome }}
            ${{ steps.command.outcome }} ${{ steps.player_gameday.outcome }} ${{ steps.ask.outcome }}
            ${{ steps.change.outcome }} ${{ steps.runtime_365.outcome }} ${{ steps.freshness.outcome }}
            ${{ steps.account.outcome }} ${{ steps.analytics.outcome }} ${{ steps.headshots.outcome }}
            ${{ steps.responsive.outcome }} ${{ steps.readability.outcome }}
        run: |
          if [[ "$DEPLOYED" != "true" ]]; then
            echo 'Source revision is not live; browser diagnostics were correctly skipped.'
            exit 0
          fi
          if grep -Eq '(^| )failure( |$)' <<< "$OUTCOMES"; then
            echo 'One or more browser diagnostics failed. See the job summary for the complete surface-by-surface result.'
            exit 1
          fi
          echo 'All post-deploy browser diagnostics passed.'
