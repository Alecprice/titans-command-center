name: Titans Post-Deploy Browser Diagnostics

on:
  workflow_run:
    workflows: ['Titans Cloudflare Deploy']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: titans-postdeploy-browser-diagnostics
  cancel-in-progress: true

jobs:
  diagnostics:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WORKER_URL: https://titans-command-center.alecjordanprice.workers.dev
    steps:
      - name: Checkout current production branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check 'selenium>=4.25,<5'

      - name: Navigation and Team Room
        id: navigation
        continue-on-error: true
        run: python scripts/browser-navigation-smoke.py

      - name: Listen Watch
        id: media
        continue-on-error: true
        run: python scripts/media-browser-smoke.py

      - name: Market Pulse
        id: market
        continue-on-error: true
        run: python scripts/market-browser-smoke.py

      - name: Command Intelligence
        id: command
        continue-on-error: true
        run: python scripts/command-intelligence-browser-smoke.py

      - name: Player Intelligence and Game Day
        id: player_gameday
        continue-on-error: true
        run: python scripts/player-gameday-browser-smoke.py

      - name: Ask Titans
        id: ask
        continue-on-error: true
        run: python scripts/ask-titans-browser-smoke.py

      - name: Change Intelligence
        id: change
        continue-on-error: true
        run: python scripts/change-intelligence-browser-smoke.py

      - name: Runtime and 365 Mode
        id: runtime_365
        continue-on-error: true
        run: python scripts/runtime-365-browser-smoke.py

      - name: Data freshness
        id: freshness
        continue-on-error: true
        run: python scripts/freshness-browser-smoke.py

      - name: Account and Guest
        id: account
        continue-on-error: true
        run: python scripts/account-browser-smoke.py

      - name: Advanced analytics
        id: analytics
        continue-on-error: true
        run: python scripts/analytics-browser-smoke.py

      - name: Player headshots
        id: headshots
        continue-on-error: true
        run: python scripts/headshot-browser-smoke.py

      - name: Expanded responsive matrix
        id: responsive
        continue-on-error: true
        run: python scripts/responsive-matrix-smoke.py

      - name: Publish diagnostic summary
        if: always()
        shell: bash
        env:
          NAVIGATION: ${{ steps.navigation.outcome }}
          MEDIA: ${{ steps.media.outcome }}
          MARKET: ${{ steps.market.outcome }}
          COMMAND: ${{ steps.command.outcome }}
          PLAYER_GAMEDAY: ${{ steps.player_gameday.outcome }}
          ASK: ${{ steps.ask.outcome }}
          CHANGE: ${{ steps.change.outcome }}
          RUNTIME_365: ${{ steps.runtime_365.outcome }}
          FRESHNESS: ${{ steps.freshness.outcome }}
          ACCOUNT: ${{ steps.account.outcome }}
          ANALYTICS: ${{ steps.analytics.outcome }}
          HEADSHOTS: ${{ steps.headshots.outcome }}
          RESPONSIVE: ${{ steps.responsive.outcome }}
        run: |
          {
            echo '## Titans post-deploy browser diagnostics'
            echo
            echo '| Surface | Result |'
            echo '| --- | --- |'
            echo "| Navigation / Team Room | $NAVIGATION |"
            echo "| Listen Watch | $MEDIA |"
            echo "| Market Pulse | $MARKET |"
            echo "| Command Intelligence | $COMMAND |"
            echo "| Player Intelligence / Game Day | $PLAYER_GAMEDAY |"
            echo "| Ask Titans | $ASK |"
            echo "| Change Intelligence | $CHANGE |"
            echo "| Runtime / 365 Mode | $RUNTIME_365 |"
            echo "| Data freshness | $FRESHNESS |"
            echo "| Account / Guest | $ACCOUNT |"
            echo "| Advanced analytics | $ANALYTICS |"
            echo "| Player headshots | $HEADSHOTS |"
            echo "| Expanded responsive matrix | $RESPONSIVE |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any browser diagnostic failed
        if: always()
        shell: bash
        env:
          OUTCOMES: >-
            ${{ steps.navigation.outcome }} ${{ steps.media.outcome }} ${{ steps.market.outcome }}
            ${{ steps.command.outcome }} ${{ steps.player_gameday.outcome }} ${{ steps.ask.outcome }}
            ${{ steps.change.outcome }} ${{ steps.runtime_365.outcome }} ${{ steps.freshness.outcome }}
            ${{ steps.account.outcome }} ${{ steps.analytics.outcome }} ${{ steps.headshots.outcome }}
            ${{ steps.responsive.outcome }}
        run: |
          if grep -Eq '(^| )failure( |$)' <<< "$OUTCOMES"; then
            echo 'One or more browser diagnostics failed. See the job summary for the complete surface-by-surface result.'
            exit 1
          fi
          echo 'All post-deploy browser diagnostics passed.'
