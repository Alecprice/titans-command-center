name: Titans Home Production Gate

on:
  workflow_run:
    workflows: ['Titans Cloudflare Deploy']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: titans-home-production-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  home:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKER_URL: https://titans.alecjprice.com
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Confirm exact production revision
        id: deployed
        continue-on-error: true
        shell: bash
        run: |
          node - <<'NODE'
          const base=process.env.WORKER_URL.replace(/\/$/,'');
          const expected=process.env.EXPECTED_SHA;
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          let observed=null;
          for(let attempt=1;attempt<=15;attempt++){
            try{
              const response=await fetch(`${base}/build-meta.json?home-audit=${attempt}`,{cache:'no-store',headers:{'cache-control':'no-cache','user-agent':'Titans-Home-Production-Gate/1.0'}});
              if(response.ok){
                const meta=await response.json();
                observed=meta?.commit||null;
                if(observed===expected){console.log(JSON.stringify({ok:true,expected,observed,attempt}));process.exit(0)}
              }
            }catch{}
            if(attempt<15)await sleep(2000);
          }
          console.error(`Home gate expected ${expected}; production served ${observed||'unknown'}`);
          process.exit(1);
          NODE

      - name: Record superseded deployment
        if: steps.deployed.outcome != 'success'
        run: echo 'Home browser gate skipped because this workflow revision is not the revision currently served by the canonical production URL.' >> "$GITHUB_STEP_SUMMARY"

      - name: Install Selenium
        if: steps.deployed.outcome == 'success'
        run: python -m pip install --disable-pip-version-check 'selenium>=4.25,<5'

      - name: Audit Home command experience
        if: steps.deployed.outcome == 'success'
        run: python scripts/home-browser-smoke-v181.py

      - name: Upload Home audit report
        if: steps.deployed.outcome == 'success' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: home-production-${{ env.EXPECTED_SHA }}
          path: /tmp/home-browser-smoke-v181.json
          if-no-files-found: ignore
          retention-days: 14
