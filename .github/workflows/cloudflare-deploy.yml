name: Titans Cloudflare Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/CLOUDFLARE_STATUS.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: titans-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRODUCTION_URL: https://titans.alecjprice.com
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
      SEATGEEK_AID: ${{ secrets.SEATGEEK_AID }}
      TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
      STUBHUB_CLIENT_ID: ${{ secrets.STUBHUB_CLIENT_ID }}
      STUBHUB_CLIENT_SECRET: ${{ secrets.STUBHUB_CLIENT_SECRET }}
      EVENTBRITE_PRIVATE_TOKEN: ${{ secrets.EVENTBRITE_PRIVATE_TOKEN }}
      EVENTBRITE_ORGANIZATION_IDS: ${{ secrets.EVENTBRITE_ORGANIZATION_IDS }}
      SKIDDLE_API_KEY: ${{ secrets.SKIDDLE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run Titans quality gate
        id: quality
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee /tmp/quality.log

      - name: Check deployment credentials
        id: creds
        if: always()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]] && echo "cloudflare=true" >> "$GITHUB_OUTPUT" || echo "cloudflare=false" >> "$GITHUB_OUTPUT"
          [[ -n "$YOUTUBE_API_KEY" ]] && echo "youtube=true" >> "$GITHUB_OUTPUT" || echo "youtube=false" >> "$GITHUB_OUTPUT"
          [[ -n "$SEATGEEK_CLIENT_ID" ]] && echo "seatgeek=true" >> "$GITHUB_OUTPUT" || echo "seatgeek=false" >> "$GITHUB_OUTPUT"
          [[ -n "$TICKETMASTER_API_KEY" ]] && echo "ticketmaster=true" >> "$GITHUB_OUTPUT" || echo "ticketmaster=false" >> "$GITHUB_OUTPUT"
          [[ -n "$STUBHUB_CLIENT_ID" && -n "$STUBHUB_CLIENT_SECRET" ]] && echo "stubhub=true" >> "$GITHUB_OUTPUT" || echo "stubhub=false" >> "$GITHUB_OUTPUT"
          [[ -n "$EVENTBRITE_PRIVATE_TOKEN" ]] && echo "eventbrite=true" >> "$GITHUB_OUTPUT" || echo "eventbrite=false" >> "$GITHUB_OUTPUT"
          [[ -n "$SKIDDLE_API_KEY" ]] && echo "skiddle=true" >> "$GITHUB_OUTPUT" || echo "skiddle=false" >> "$GITHUB_OUTPUT"

      - name: Verify deployment source is current main
        id: source_guard
        if: steps.quality.outcome == 'success'
        shell: bash
        run: |
          git fetch origin main
          CURRENT_MAIN_SHA="$(git rev-parse origin/main)"
          echo "current_main_sha=$CURRENT_MAIN_SHA" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_SHA" == "$CURRENT_MAIN_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "Deploy source is current main: $GITHUB_SHA"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale deploy source $GITHUB_SHA; current main is $CURRENT_MAIN_SHA"
          fi

      - name: Build Worker secret bundle
        if: steps.quality.outcome == 'success' && steps.creds.outputs.cloudflare == 'true' && steps.source_guard.outputs.current == 'true'
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const keys = [
            'YOUTUBE_API_KEY',
            'SEATGEEK_CLIENT_ID',
            'SEATGEEK_AID',
            'TICKETMASTER_API_KEY',
            'STUBHUB_CLIENT_ID',
            'STUBHUB_CLIENT_SECRET',
            'EVENTBRITE_PRIVATE_TOKEN',
            'EVENTBRITE_ORGANIZATION_IDS',
            'SKIDDLE_API_KEY',
          ];
          const secrets = {};
          for (const key of keys) {
            const value = String(process.env[key] || '').trim();
            if (value) secrets[key] = value;
          }
          fs.writeFileSync('/tmp/titans-worker-secrets.json', JSON.stringify(secrets), {mode: 0o600});
          console.log(`Prepared ${Object.keys(secrets).length} optional Worker secret binding(s) without printing values.`);
          NODE

      - name: Deploy to Cloudflare
        id: deploy
        if: steps.quality.outcome == 'success' && steps.creds.outputs.cloudflare == 'true' && steps.source_guard.outputs.current == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy --secrets-file /tmp/titans-worker-secrets.json

      - name: Verify canonical front door and Worker rollback path
        id: frontdoor
        if: steps.deploy.outcome == 'success'
        env:
          CUSTOM_DOMAIN_URL: ${{ env.PRODUCTION_URL }}
          ORIGIN_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: node scripts/custom-domain-regression.mjs

      - name: Run production regression audit
        id: smoke
        if: steps.frontdoor.outcome == 'success'
        env:
          WORKER_URL: ${{ env.PRODUCTION_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: npm run audit:production && node scripts/advanced-analytics-regression.mjs && node scripts/headshot-production-regression.mjs

      - name: Run Fan Event Radar production regression
        id: fan_events_smoke
        if: steps.smoke.outcome == 'success'
        shell: bash
        env:
          PRODUCTION_URL: ${{ env.PRODUCTION_URL }}
        run: |
          set -o pipefail
          node scripts/fan-events-production-regression.mjs | tee /tmp/fan-events-production-smoke.json

      - name: Install Selenium for browser regressions
        if: steps.fan_events_smoke.outcome == 'success'
        run: python -m pip install --disable-pip-version-check 'selenium>=4.25,<5'

      - name: Run browser navigation stress test
        id: browser
        if: steps.fan_events_smoke.outcome == 'success'
        env:
          WORKER_URL: ${{ env.PRODUCTION_URL }}
        run: python scripts/browser-navigation-smoke.py

      - name: Run Listen Watch browser regression
        id: media_browser
        if: steps.browser.outcome == 'success'
        env:
          WORKER_URL: ${{ env.PRODUCTION_URL }}
        run: python scripts/media-browser-smoke.py

      - name: Run Market Pulse browser regression
        id: market_browser
        if: steps.media_browser.outcome == 'success'
        env:
          WORKER_URL: ${{ env.PRODUCTION_URL }}
        run: python scripts/market-browser-smoke.py

      - name: Run Ticket Center browser regression
        id: tickets_browser
        if: steps.market_browser.outcome == 'success'
        env:
          WORKER_URL: ${{ env.PRODUCTION_URL }}
        run: python scripts/tickets-browser-smoke.py

      - name: Run Command Intelligence browser regression
        id: command_browser
        if: steps.tickets_browser.outcome == 'success'
        env:
          WORKER_URL: ${{ env.PRODUCTION_URL }}
        run: python scripts/command-intelligence-browser-smoke.py

      - name: Run Player Intelligence and Game Day browser regression
        id: player_gameday_browser
        if: steps.command_browser.outcome == 'success'
        env:
          WORKER_URL: ${{ env.PRODUCTION_URL }}
        run: python scripts/player-gameday-browser-smoke-resilient.py

      - name: Run Ask Titans browser regression
        id: ask_browser
        if: steps.player_gameday_browser.outcome == 'success'
        env:
          WORKER_URL: ${{ env.PRODUCTION_URL }}
        run: python scripts/ask-titans-browser-smoke.py

      - name: Run Change Intelligence browser regression
        id: change_browser
        if: steps.ask_browser.outcome == 'success'
        env:
          WORKER_URL: ${{ env.PRODUCTION_URL }}
        run: python scripts/change-intelligence-browser-smoke.py

      - name: Run runtime and 365 Mode browser regression
        id: runtime_365_browser
        if: steps.change_browser.outcome == 'success'
        env:
          WORKER_URL: ${{ env.PRODUCTION_URL }}
        run: python scripts/runtime-365-browser-smoke.py

      - name: Run data freshness browser regression
        id: freshness_browser
        if: steps.runtime_365_browser.outcome == 'success'
        env:
          WORKER_URL: ${{ env.PRODUCTION_URL }}
        run: python scripts/freshness-browser-smoke.py

      - name: Run Account and Guest browser regression
        id: account_browser
        if: steps.freshness_browser.outcome == 'success'
        env:
          WORKER_URL: ${{ env.PRODUCTION_URL }}
        run: python scripts/account-browser-smoke.py

      - name: Run advanced analytics browser regression
        id: analytics_browser
        if: steps.account_browser.outcome == 'success'
        env:
          WORKER_URL: ${{ env.PRODUCTION_URL }}
        run: python scripts/analytics-browser-smoke-resilient.py

      - name: Run player headshot browser regression
        id: headshot_browser
        if: steps.analytics_browser.outcome == 'success'
        env:
          WORKER_URL: ${{ env.PRODUCTION_URL }}
        run: python scripts/headshot-browser-smoke.py

      - name: Record Cloudflare deployment result
        if: ${{ always() && !cancelled() }}
        shell: bash
        env:
          QUALITY_OUTCOME: ${{ steps.quality.outcome }}
          CLOUDFLARE_READY: ${{ steps.creds.outputs.cloudflare }}
          SOURCE_CURRENT: ${{ steps.source_guard.outputs.current }}
          CURRENT_MAIN_SHA: ${{ steps.source_guard.outputs.current_main_sha }}
          YOUTUBE_READY: ${{ steps.creds.outputs.youtube }}
          SEATGEEK_READY: ${{ steps.creds.outputs.seatgeek }}
          TICKETMASTER_READY: ${{ steps.creds.outputs.ticketmaster }}
          STUBHUB_READY: ${{ steps.creds.outputs.stubhub }}
          EVENTBRITE_READY: ${{ steps.creds.outputs.eventbrite }}
          SKIDDLE_READY: ${{ steps.creds.outputs.skiddle }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          FRONTDOOR_OUTCOME: ${{ steps.frontdoor.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          FAN_EVENTS_SMOKE_OUTCOME: ${{ steps.fan_events_smoke.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          MEDIA_BROWSER_OUTCOME: ${{ steps.media_browser.outcome }}
          MARKET_BROWSER_OUTCOME: ${{ steps.market_browser.outcome }}
          TICKETS_BROWSER_OUTCOME: ${{ steps.tickets_browser.outcome }}
          COMMAND_BROWSER_OUTCOME: ${{ steps.command_browser.outcome }}
          PLAYER_GAMEDAY_BROWSER_OUTCOME: ${{ steps.player_gameday_browser.outcome }}
          ASK_BROWSER_OUTCOME: ${{ steps.ask_browser.outcome }}
          CHANGE_BROWSER_OUTCOME: ${{ steps.change_browser.outcome }}
          RUNTIME_365_BROWSER_OUTCOME: ${{ steps.runtime_365_browser.outcome }}
          FRESHNESS_BROWSER_OUTCOME: ${{ steps.freshness_browser.outcome }}
          ACCOUNT_BROWSER_OUTCOME: ${{ steps.account_browser.outcome }}
          ANALYTICS_BROWSER_OUTCOME: ${{ steps.analytics_browser.outcome }}
          HEADSHOT_BROWSER_OUTCOME: ${{ steps.headshot_browser.outcome }}
          PRODUCTION_URL: ${{ env.PRODUCTION_URL }}
          ORIGIN_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [[ "$QUALITY_OUTCOME" != "success" ]]; then STATUS='quality gate failed before Cloudflare deploy';
          elif [[ "$CLOUDFLARE_READY" != "true" ]]; then STATUS='Cloudflare credentials unavailable to workflow';
          elif [[ "$SOURCE_CURRENT" != "true" ]]; then STATUS="stale deploy source skipped; current main is ${CURRENT_MAIN_SHA:-unknown}";
          elif [[ "$DEPLOY_OUTCOME" != "success" ]]; then STATUS='Cloudflare deploy failed';
          elif [[ "$FRONTDOOR_OUTCOME" != "success" ]]; then STATUS="deployed + canonical front door ${FRONTDOOR_OUTCOME:-not-run}";
          elif [[ "$SMOKE_OUTCOME" != "success" ]]; then STATUS="deployed + production regression ${SMOKE_OUTCOME:-not-run}";
          elif [[ "$FAN_EVENTS_SMOKE_OUTCOME" != "success" ]]; then STATUS="deployed + Fan Event Radar production regression ${FAN_EVENTS_SMOKE_OUTCOME:-not-run}";
          elif [[ "$BROWSER_OUTCOME" != "success" ]]; then STATUS="deployed + browser navigation regression ${BROWSER_OUTCOME:-not-run}";
          elif [[ "$MEDIA_BROWSER_OUTCOME" != "success" ]]; then STATUS="deployed + Listen Watch browser regression ${MEDIA_BROWSER_OUTCOME:-not-run}";
          elif [[ "$MARKET_BROWSER_OUTCOME" != "success" ]]; then STATUS="deployed + Market Pulse browser regression ${MARKET_BROWSER_OUTCOME:-not-run}";
          elif [[ "$TICKETS_BROWSER_OUTCOME" != "success" ]]; then STATUS="deployed + Ticket Center browser regression ${TICKETS_BROWSER_OUTCOME:-not-run}";
          elif [[ "$COMMAND_BROWSER_OUTCOME" != "success" ]]; then STATUS="deployed + Command Intelligence browser regression ${COMMAND_BROWSER_OUTCOME:-not-run}";
          elif [[ "$PLAYER_GAMEDAY_BROWSER_OUTCOME" != "success" ]]; then STATUS="deployed + Player Intelligence / Game Day browser regression ${PLAYER_GAMEDAY_BROWSER_OUTCOME:-not-run}";
          elif [[ "$ASK_BROWSER_OUTCOME" != "success" ]]; then STATUS="deployed + Ask Titans browser regression ${ASK_BROWSER_OUTCOME:-not-run}";
          elif [[ "$CHANGE_BROWSER_OUTCOME" != "success" ]]; then STATUS="deployed + Change Intelligence browser regression ${CHANGE_BROWSER_OUTCOME:-not-run}";
          elif [[ "$RUNTIME_365_BROWSER_OUTCOME" != "success" ]]; then STATUS="deployed + runtime / 365 Mode browser regression ${RUNTIME_365_BROWSER_OUTCOME:-not-run}";
          elif [[ "$FRESHNESS_BROWSER_OUTCOME" != "success" ]]; then STATUS="deployed + data freshness browser regression ${FRESHNESS_BROWSER_OUTCOME:-not-run}";
          elif [[ "$ACCOUNT_BROWSER_OUTCOME" != "success" ]]; then STATUS="deployed + Account / Guest browser regression ${ACCOUNT_BROWSER_OUTCOME:-not-run}";
          elif [[ "$ANALYTICS_BROWSER_OUTCOME" != "success" ]]; then STATUS="deployed + advanced analytics browser regression ${ANALYTICS_BROWSER_OUTCOME:-not-run}";
          elif [[ "$HEADSHOT_BROWSER_OUTCOME" == "success" ]]; then STATUS='deployed + canonical front door + full production + fan events + browser + media + market + tickets + command intelligence + player intelligence + game day + Ask Titans + change intelligence + 365 mode + freshness + account + analytics + player headshot regressions passed';
          else STATUS="deployed + player headshot browser regression ${HEADSHOT_BROWSER_OUTCOME:-not-run}"; fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if ! git diff --quiet "$GITHUB_SHA" origin/main -- . ':(exclude)docs/CLOUDFLARE_STATUS.md'; then
            echo "Skipping deployment status write because main contains newer non-status changes than $GITHUB_SHA."
            exit 0
          fi
          git checkout -B main origin/main

          {
            echo '# Cloudflare deployment status'
            echo
            echo "- Status: **$STATUS**"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- Quality gate: ${QUALITY_OUTCOME:-unknown}"
            echo "- Cloudflare credentials available: ${CLOUDFLARE_READY:-unknown}"
            echo "- Source still current main: ${SOURCE_CURRENT:-unknown}"
            [[ -n "$CURRENT_MAIN_SHA" ]] && echo "- Main SHA observed before deploy: \`$CURRENT_MAIN_SHA\`"
            echo '- Neon warehouse deployment secret required: false (D1 primary)'
            echo "- YouTube Data API configured: ${YOUTUBE_READY:-false}"
            echo "- Ticket providers configured: SeatGeek=${SEATGEEK_READY:-false}, Ticketmaster=${TICKETMASTER_READY:-false}, StubHub=${STUBHUB_READY:-false}"
            echo "- Fan event GitHub-managed secrets available: Eventbrite=${EVENTBRITE_READY:-false}, Skiddle=${SKIDDLE_READY:-false}"
            echo "- Deploy outcome: ${DEPLOY_OUTCOME:-unknown}"
            echo "- Canonical front door: ${FRONTDOOR_OUTCOME:-not-run}"
            echo "- Production regression: ${SMOKE_OUTCOME:-not-run}"
            echo "- Fan Event Radar production regression: ${FAN_EVENTS_SMOKE_OUTCOME:-not-run}"
            echo "- Browser navigation regression: ${BROWSER_OUTCOME:-not-run}"
            echo "- Listen Watch browser regression: ${MEDIA_BROWSER_OUTCOME:-not-run}"
            echo "- Market Pulse browser regression: ${MARKET_BROWSER_OUTCOME:-not-run}"
            echo "- Ticket Center browser regression: ${TICKETS_BROWSER_OUTCOME:-not-run}"
            echo "- Command Intelligence browser regression: ${COMMAND_BROWSER_OUTCOME:-not-run}"
            echo "- Player Intelligence / Game Day browser regression: ${PLAYER_GAMEDAY_BROWSER_OUTCOME:-not-run}"
            echo "- Ask Titans browser regression: ${ASK_BROWSER_OUTCOME:-not-run}"
            echo "- Change Intelligence browser regression: ${CHANGE_BROWSER_OUTCOME:-not-run}"
            echo "- Runtime / 365 Mode browser regression: ${RUNTIME_365_BROWSER_OUTCOME:-not-run}"
            echo "- Data freshness browser regression: ${FRESHNESS_BROWSER_OUTCOME:-not-run}"
            echo "- Account / Guest browser regression: ${ACCOUNT_BROWSER_OUTCOME:-not-run}"
            echo "- Advanced analytics browser regression: ${ANALYTICS_BROWSER_OUTCOME:-not-run}"
            echo "- Player headshot browser regression: ${HEADSHOT_BROWSER_OUTCOME:-not-run}"
            [[ -n "$PRODUCTION_URL" ]] && echo "- Production URL: $PRODUCTION_URL" || echo '- Production URL: unavailable'
            [[ -n "$ORIGIN_URL" ]] && echo "- Rollback Worker URL: $ORIGIN_URL" || echo '- Rollback Worker URL: existing deployment remains unchanged'
            echo "- Recorded: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            if [[ "$QUALITY_OUTCOME" != "success" && -f /tmp/quality.log ]]; then
              echo; echo '## Quality gate failure context'; echo; echo '```text'
              awk 'BEGIN{show=0} /^not ok/{show=70} show>0{print;show--}' /tmp/quality.log | head -n 180
              echo; echo '--- tail ---'; tail -n 80 /tmp/quality.log
              echo '```'
            fi
            if [[ -f /tmp/custom-domain-smoke.json ]]; then echo; echo '## Canonical front door regression'; echo; echo '```json'; cat /tmp/custom-domain-smoke.json; echo '```'; fi
            if [[ -f /tmp/cloudflare-smoke.json ]]; then echo; echo '## Production regression'; echo; echo '```json'; cat /tmp/cloudflare-smoke.json; echo '```'; fi
            if [[ -f /tmp/fan-events-production-smoke.json ]]; then echo; echo '## Fan Event Radar production regression'; echo; echo '```json'; cat /tmp/fan-events-production-smoke.json; echo '```'; fi
            if [[ -f /tmp/headshot-production-smoke.json ]]; then echo; echo '## Player headshot production regression'; echo; echo '```json'; cat /tmp/headshot-production-smoke.json; echo '```'; fi
            if [[ -f /tmp/browser-nav-smoke.json ]]; then echo; echo '## Browser navigation regression'; echo; echo '```json'; cat /tmp/browser-nav-smoke.json; echo '```'; fi
            if [[ -f /tmp/media-browser-smoke.json ]]; then echo; echo '## Listen Watch browser regression'; echo; echo '```json'; cat /tmp/media-browser-smoke.json; echo '```'; fi
            if [[ -f /tmp/market-browser-smoke.json ]]; then echo; echo '## Market Pulse browser regression'; echo; echo '```json'; cat /tmp/market-browser-smoke.json; echo '```'; fi
            if [[ -f /tmp/tickets-browser-smoke.json ]]; then echo; echo '## Ticket Center browser regression'; echo; echo '```json'; cat /tmp/tickets-browser-smoke.json; echo '```'; fi
            if [[ -f /tmp/command-intelligence-browser-smoke.json ]]; then echo; echo '## Command Intelligence browser regression'; echo; echo '```json'; cat /tmp/command-intelligence-browser-smoke.json; echo '```'; fi
            if [[ -f /tmp/player-gameday-browser-smoke.json ]]; then echo; echo '## Player Intelligence / Game Day browser regression'; echo; echo '```json'; cat /tmp/player-gameday-browser-smoke.json; echo '```'; fi
            if [[ -f /tmp/ask-titans-browser-smoke.json ]]; then echo; echo '## Ask Titans browser regression'; echo; echo '```json'; cat /tmp/ask-titans-browser-smoke.json; echo '```'; fi
            if [[ -f /tmp/change-intelligence-browser-smoke.json ]]; then echo; echo '## Change Intelligence browser regression'; echo; echo '```json'; cat /tmp/change-intelligence-browser-smoke.json; echo '```'; fi
            if [[ -f /tmp/runtime-365-browser-smoke.json ]]; then echo; echo '## Runtime / 365 Mode browser regression'; echo; echo '```json'; cat /tmp/runtime-365-browser-smoke.json; echo '```'; fi
            if [[ -f /tmp/freshness-browser-smoke.json ]]; then echo; echo '## Data freshness browser regression'; echo; echo '```json'; cat /tmp/freshness-browser-smoke.json; echo '```'; fi
            if [[ -f /tmp/account-browser-smoke.json ]]; then echo; echo '## Account / Guest browser regression'; echo; echo '```json'; cat /tmp/account-browser-smoke.json; echo '```'; fi
            if [[ -f /tmp/analytics-browser-smoke.json ]]; then echo; echo '## Advanced analytics browser regression'; echo; echo '```json'; cat /tmp/analytics-browser-smoke.json; echo '```'; fi
            if [[ -f /tmp/headshot-browser-smoke.json ]]; then echo; echo '## Player headshot browser regression'; echo; echo '```json'; cat /tmp/headshot-browser-smoke.json; echo '```'; fi
            echo
            echo 'Generated automatically by `.github/workflows/cloudflare-deploy.yml`.'
          } > docs/CLOUDFLARE_STATUS.md
          git add docs/CLOUDFLARE_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record Cloudflare deployment status [skip ci]'
            git push origin main
          fi