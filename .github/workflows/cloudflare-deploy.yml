name: Titans Cloudflare Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/CLOUDFLARE_STATUS.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: titans-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run Titans quality gate
        id: quality
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee /tmp/quality.log

      - name: Check deployment credentials
        id: creds
        if: always()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]] && echo "cloudflare=true" >> "$GITHUB_OUTPUT" || echo "cloudflare=false" >> "$GITHUB_OUTPUT"
          [[ -n "$DATABASE_URL" ]] && echo "database=true" >> "$GITHUB_OUTPUT" || echo "database=false" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare
        id: deploy
        if: steps.quality.outcome == 'success' && steps.creds.outputs.cloudflare == 'true' && steps.creds.outputs.database == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy
          secrets: |
            DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run production regression audit
        id: smoke
        if: steps.deploy.outcome == 'success'
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: npm run audit:production

      - name: Install Selenium for browser stress test
        if: steps.smoke.outcome == 'success'
        run: python -m pip install --disable-pip-version-check 'selenium>=4.25,<5'

      - name: Run browser navigation stress test
        id: browser
        if: steps.smoke.outcome == 'success'
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: python scripts/browser-navigation-smoke.py

      - name: Record Cloudflare deployment result
        if: always()
        shell: bash
        env:
          QUALITY_OUTCOME: ${{ steps.quality.outcome }}
          CLOUDFLARE_READY: ${{ steps.creds.outputs.cloudflare }}
          DATABASE_READY: ${{ steps.creds.outputs.database }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [[ "$QUALITY_OUTCOME" != "success" ]]; then STATUS='quality gate failed before Cloudflare deploy';
          elif [[ "$CLOUDFLARE_READY" != "true" ]]; then STATUS='Cloudflare credentials unavailable to workflow';
          elif [[ "$DATABASE_READY" != "true" ]]; then STATUS='DATABASE_URL GitHub secret missing';
          elif [[ "$DEPLOY_OUTCOME" != "success" ]]; then STATUS='Cloudflare deploy failed';
          elif [[ "$SMOKE_OUTCOME" != "success" ]]; then STATUS="deployed + production regression ${SMOKE_OUTCOME:-not-run}";
          elif [[ "$BROWSER_OUTCOME" == "success" ]]; then STATUS='deployed + full production + browser navigation regression passed';
          else STATUS="deployed + browser navigation regression ${BROWSER_OUTCOME:-not-run}"; fi
          {
            echo '# Cloudflare deployment status'
            echo
            echo "- Status: **$STATUS**"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- Quality gate: ${QUALITY_OUTCOME:-unknown}"
            echo "- Cloudflare credentials available: ${CLOUDFLARE_READY:-unknown}"
            echo "- DATABASE_URL GitHub secret supplied: ${DATABASE_READY:-unknown}"
            echo "- Deploy outcome: ${DEPLOY_OUTCOME:-unknown}"
            echo "- Production regression: ${SMOKE_OUTCOME:-not-run}"
            echo "- Browser navigation regression: ${BROWSER_OUTCOME:-not-run}"
            [[ -n "$WORKER_URL" ]] && echo "- Worker URL: $WORKER_URL" || echo '- Worker URL: existing deployment remains unchanged'
            echo "- Recorded: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            if [[ "$QUALITY_OUTCOME" != "success" && -f /tmp/quality.log ]]; then echo; echo '## Quality gate tail'; echo; echo '```text'; tail -n 120 /tmp/quality.log; echo '```'; fi
            if [[ -f /tmp/cloudflare-smoke.json ]]; then echo; echo '## Production regression'; echo; echo '```json'; cat /tmp/cloudflare-smoke.json; echo '```'; fi
            if [[ -f /tmp/browser-nav-smoke.json ]]; then echo; echo '## Browser navigation regression'; echo; echo '```json'; cat /tmp/browser-nav-smoke.json; echo '```'; fi
            echo
            echo 'Generated automatically by `.github/workflows/cloudflare-deploy.yml`.'
          } > docs/CLOUDFLARE_STATUS.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CLOUDFLARE_STATUS.md
          if ! git diff --cached --quiet; then git commit -m 'chore: record Cloudflare deployment status [skip ci]'; git push; fi
