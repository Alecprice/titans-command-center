name: Titans Cloudflare Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/CLOUDFLARE_STATUS.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: titans-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run Titans quality gate
        run: npm run check

      - name: Check Cloudflare deployment credentials
        id: cloudflare
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deploy skipped until CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets are configured."
          fi

      - name: Deploy Worker + static assets
        id: deploy
        if: steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          set -o pipefail
          npm run deploy:cloudflare 2>&1 | tee /tmp/cloudflare-deploy.log
          WORKER_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/cloudflare-deploy.log | tail -1 || true)"
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"

      - name: Record successful Cloudflare deployment
        if: steps.deploy.outcome == 'success'
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          {
            echo '# Cloudflare deployment status'
            echo
            echo '- Status: **deployed**'
            echo "- Source commit: \`$GITHUB_SHA\`"
            if [[ -n "$WORKER_URL" ]]; then
              echo "- Worker URL: $WORKER_URL"
            else
              echo '- Worker URL: deployment succeeded; Wrangler did not emit a parseable workers.dev URL in this run.'
            fi
            echo "- Recorded: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo 'Generated automatically by `.github/workflows/cloudflare-deploy.yml` after a successful Cloudflare deployment.'
          } > docs/CLOUDFLARE_STATUS.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CLOUDFLARE_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record Cloudflare deployment status [skip ci]'
            git push
          fi
