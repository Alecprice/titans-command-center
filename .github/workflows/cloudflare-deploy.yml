name: Titans Cloudflare Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/CLOUDFLARE_STATUS.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: titans-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run Titans quality gate
        id: quality
        run: npm run check

      - name: Check deployment credentials
        id: creds
        if: always()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]] && echo "cloudflare=true" >> "$GITHUB_OUTPUT" || echo "cloudflare=false" >> "$GITHUB_OUTPUT"
          [[ -n "$DATABASE_URL" ]] && echo "database=true" >> "$GITHUB_OUTPUT" || echo "database=false" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare
        id: deploy
        if: steps.quality.outcome == 'success' && steps.creds.outputs.cloudflare == 'true' && steps.creds.outputs.database == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy
          secrets: |
            DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Smoke test deployed Worker
        id: smoke
        if: steps.deploy.outcome == 'success'
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base=process.env.WORKER_URL;
          if(!base) throw new Error('Cloudflare action did not return a deployment URL');
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          async function get(path,{json=false,retries=4}={}){
            let last;
            for(let i=0;i<retries;i++){
              try{
                const response=await fetch(`${base}${path}`,{headers:{'User-Agent':'TitansCommandCenter-CI/0.8'},signal:AbortSignal.timeout(15000)});
                const body=json?await response.json():await response.arrayBuffer();
                return {status:response.status,body};
              }catch(error){last=error;if(i<retries-1)await wait(2500);}
            }
            throw last;
          }
          const root=await get('/');
          const shield=await get('/assets/archive/current-shield-primary.webp');
          const health=await get('/api/health',{json:true});
          const data=await get('/api/data',{json:true});
          const stats=await get('/api/preseason-stats',{json:true});
          const market=await get('/api/market-data',{json:true});
          const result={rootStatus:root.status,shieldStatus:shield.status,healthStatus:health.status,appStatus:health.body?.status||null,databaseOk:Boolean(health.body?.database?.ok),databaseConfigured:Boolean(health.body?.database?.configured),dataStatus:data.status,dataOk:Boolean(data.body?.ok),dataRosterCount:Array.isArray(data.body?.roster)?data.body.roster.length:0,statsStatus:stats.status,rosterCount:Number(stats.body?.rosterCount||0),statsRosterSource:stats.body?.rosterSource||null,completedPreseasonGames:Array.isArray(stats.body?.completedGames)?stats.body.completedGames.length:0,marketStatus:market.status,marketOk:Boolean(market.body?.ok),marketRows:Array.isArray(market.body?.odds)?market.body.odds.length:0,marketMode:market.body?.sourceMode||null,testedAt:new Date().toISOString()};
          fs.writeFileSync('/tmp/cloudflare-smoke.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify(result,null,2));
          if(root.status!==200||shield.status!==200||health.status!==200)throw new Error('Static/health smoke test failed');
          if(!result.databaseConfigured||!result.databaseOk||result.appStatus!=='healthy')throw new Error(`Neon health failed: configured=${result.databaseConfigured}, ok=${result.databaseOk}, app=${result.appStatus}`);
          if(data.status!==200||!result.dataOk)throw new Error(`Data API failed: ${data.status}`);
          if(stats.status!==200||result.rosterCount<90||!/Neon/i.test(result.statsRosterSource||''))throw new Error(`Stats is not Neon-backed: ${result.statsRosterSource||'unknown'}`);
          if(market.status!==200||!result.marketOk)throw new Error(`Market API failed: ${market.status}`);
          NODE

      - name: Record Cloudflare deployment result
        if: always()
        shell: bash
        env:
          QUALITY_OUTCOME: ${{ steps.quality.outcome }}
          CLOUDFLARE_READY: ${{ steps.creds.outputs.cloudflare }}
          DATABASE_READY: ${{ steps.creds.outputs.database }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [[ "$QUALITY_OUTCOME" != "success" ]]; then STATUS='quality gate failed before Cloudflare deploy';
          elif [[ "$CLOUDFLARE_READY" != "true" ]]; then STATUS='Cloudflare credentials unavailable to workflow';
          elif [[ "$DATABASE_READY" != "true" ]]; then STATUS='DATABASE_URL GitHub secret missing';
          elif [[ "$DEPLOY_OUTCOME" != "success" ]]; then STATUS='Cloudflare deploy failed';
          elif [[ "$SMOKE_OUTCOME" == "success" ]]; then STATUS='deployed + smoke-tested + Neon healthy';
          else STATUS="deployed + smoke check ${SMOKE_OUTCOME:-not-run}"; fi
          {
            echo '# Cloudflare deployment status'
            echo
            echo "- Status: **$STATUS**"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- Quality gate: ${QUALITY_OUTCOME:-unknown}"
            echo "- Cloudflare credentials available: ${CLOUDFLARE_READY:-unknown}"
            echo "- DATABASE_URL GitHub secret supplied: ${DATABASE_READY:-unknown}"
            echo "- Deploy outcome: ${DEPLOY_OUTCOME:-unknown}"
            echo "- Smoke outcome: ${SMOKE_OUTCOME:-not-run}"
            [[ -n "$WORKER_URL" ]] && echo "- Worker URL: $WORKER_URL" || echo '- Worker URL: existing deployment remains unchanged'
            echo "- Recorded: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            if [[ -f /tmp/cloudflare-smoke.json ]]; then echo; echo '## Smoke test'; echo; echo '```json'; cat /tmp/cloudflare-smoke.json; echo '```'; fi
            echo
            echo 'Generated automatically by `.github/workflows/cloudflare-deploy.yml`.'
          } > docs/CLOUDFLARE_STATUS.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CLOUDFLARE_STATUS.md
          if ! git diff --cached --quiet; then git commit -m 'chore: record Cloudflare deployment status [skip ci]'; git push; fi
