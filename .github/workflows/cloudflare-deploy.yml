name: Titans Cloudflare Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/CLOUDFLARE_STATUS.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: titans-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run Titans quality gate
        run: npm run check

      - name: Check Cloudflare deployment credentials
        id: cloudflare
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deploy skipped until CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets are configured."
          fi
          if [[ -n "$DATABASE_URL" ]]; then
            echo "database_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "database_ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DATABASE_URL GitHub Actions secret is not configured; deploy will continue without uploading a database secret."
          fi

      - name: Deploy Worker + static assets
        id: deploy
        if: steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run build:cloudflare
          if [[ -n "$DATABASE_URL" ]]; then
            node --input-type=module <<'NODE'
            import fs from 'node:fs';
            fs.writeFileSync('/tmp/cloudflare-secrets.json',JSON.stringify({DATABASE_URL:process.env.DATABASE_URL}));
            NODE
            npx wrangler@4 deploy --secrets-file /tmp/cloudflare-secrets.json 2>&1 | tee /tmp/cloudflare-deploy.log
            rm -f /tmp/cloudflare-secrets.json
          else
            npx wrangler@4 deploy 2>&1 | tee /tmp/cloudflare-deploy.log
          fi
          WORKER_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/cloudflare-deploy.log | tail -1 || true)"
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test deployed Worker
        id: smoke
        if: steps.deploy.outcome == 'success' && steps.deploy.outputs.worker_url != ''
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base=process.env.WORKER_URL;
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          async function get(path,{json=false,retries=4}={}){
            let last;
            for(let i=0;i<retries;i++){
              try{
                const response=await fetch(`${base}${path}`,{headers:{'User-Agent':'TitansCommandCenter-CI/0.8'},signal:AbortSignal.timeout(15000)});
                const body=json?await response.json():await response.arrayBuffer();
                return {status:response.status,body,contentType:response.headers.get('content-type')||''};
              }catch(error){last=error;if(i<retries-1)await wait(2500);}
            }
            throw last;
          }
          const root=await get('/');
          const shield=await get('/assets/archive/current-shield-primary.webp');
          const health=await get('/api/health',{json:true});
          const data=await get('/api/data',{json:true});
          const stats=await get('/api/preseason-stats',{json:true});
          const market=await get('/api/market-data',{json:true});
          const result={
            rootStatus:root.status,
            shieldStatus:shield.status,
            healthStatus:health.status,
            appStatus:health.body?.status||null,
            databaseOk:Boolean(health.body?.database?.ok),
            databaseConfigured:Boolean(health.body?.database?.configured),
            dataStatus:data.status,
            dataOk:Boolean(data.body?.ok),
            dataRosterCount:Array.isArray(data.body?.roster)?data.body.roster.length:0,
            statsStatus:stats.status,
            rosterCount:Number(stats.body?.rosterCount||0),
            statsRosterSource:stats.body?.rosterSource||null,
            completedPreseasonGames:Array.isArray(stats.body?.completedGames)?stats.body.completedGames.length:0,
            marketStatus:market.status,
            marketOk:Boolean(market.body?.ok),
            marketRows:Array.isArray(market.body?.odds)?market.body.odds.length:0,
            marketMode:market.body?.sourceMode||null,
            testedAt:new Date().toISOString()
          };
          fs.writeFileSync('/tmp/cloudflare-smoke.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify(result,null,2));
          if(root.status!==200)throw new Error(`Root returned ${root.status}`);
          if(shield.status!==200)throw new Error(`Shield asset returned ${shield.status}`);
          if(health.status!==200)throw new Error(`Health returned ${health.status}`);
          if(!result.databaseConfigured||!result.databaseOk||result.appStatus!=='healthy')throw new Error(`Neon health failed: configured=${result.databaseConfigured}, ok=${result.databaseOk}, app=${result.appStatus}`);
          if(data.status!==200||!result.dataOk)throw new Error(`Data API failed: ${data.status}`);
          if(stats.status!==200||result.rosterCount<90)throw new Error(`Preseason stats failed: ${stats.status}, roster ${result.rosterCount}`);
          if(!/Neon/i.test(result.statsRosterSource||''))throw new Error(`Stats roster is not Neon-backed: ${result.statsRosterSource||'unknown source'}`);
          if(market.status!==200||!result.marketOk)throw new Error(`Market API failed: ${market.status}`);
          NODE

      - name: Record Cloudflare deployment result
        if: always() && steps.deploy.outcome == 'success'
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          DATABASE_READY: ${{ steps.cloudflare.outputs.database_ready }}
        run: |
          if [[ "$SMOKE_OUTCOME" == "success" ]]; then
            STATUS='deployed + smoke-tested + Neon healthy'
          else
            STATUS="deployed + smoke check ${SMOKE_OUTCOME}"
          fi
          {
            echo '# Cloudflare deployment status'
            echo
            echo "- Status: **$STATUS**"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- DATABASE_URL GitHub secret supplied to deploy: $DATABASE_READY"
            if [[ -n "$WORKER_URL" ]]; then
              echo "- Worker URL: $WORKER_URL"
            else
              echo '- Worker URL: deployment succeeded; Wrangler did not emit a parseable workers.dev URL in this run.'
            fi
            echo "- Recorded: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            if [[ -f /tmp/cloudflare-smoke.json ]]; then
              echo
              echo '## Smoke test'
              echo
              echo '```json'
              cat /tmp/cloudflare-smoke.json
              echo '```'
            fi
            echo
            echo 'Generated automatically by `.github/workflows/cloudflare-deploy.yml` after a Cloudflare deployment and regression smoke test.'
          } > docs/CLOUDFLARE_STATUS.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CLOUDFLARE_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record Cloudflare deployment status [skip ci]'
            git push
          fi
